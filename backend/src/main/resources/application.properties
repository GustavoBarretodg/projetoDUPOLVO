# Server
server.port=${PORT:8080}

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET:dXBvbHZvU2VjcmV0S2V5UGFyYUpXVDIwMjZEdXBvbHZv}

# Email (SMTP) - manda o codigo de "esqueci minha senha" de verdade. So fica
# ativo com MAIL_ENABLED=true (ver SmtpMailSender); enquanto isso, o
# ConsoleMailSender continua so jogando o codigo no log do servidor. Pra
# Gmail, MAIL_USERNAME/MAIL_PASSWORD precisam ser uma "senha de app" (com
# verificacao em 2 etapas ativada na conta), nao a senha normal do Google.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@dupolvo.com}}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
