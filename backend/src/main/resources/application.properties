# Server
server.port=${PORT:8080}

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET:dXBvbHZvU2VjcmV0S2V5UGFyYUpXVDIwMjZEdXBvbHZv}

# Email - manda o codigo de "esqueci minha senha" de verdade. app.mail.provider
# escolhe quem manda (variavel MAIL_PROVIDER no Render):
#   console -> so loga o codigo (padrao, bom pra dev local)
#   smtp    -> Gmail/SMTP - NAO funciona no Render (bloqueiam a porta 587 de
#              saida, ver SmtpMailSender), mas pode funcionar em outro host
#   resend  -> API da Resend via HTTPS - funciona no Render (ver
#              ResendMailSender), precisa de RESEND_API_KEY
app.mail.provider=${MAIL_PROVIDER:console}
app.mail.from=${MAIL_FROM:onboarding@resend.dev}
resend.api.key=${RESEND_API_KEY:}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
