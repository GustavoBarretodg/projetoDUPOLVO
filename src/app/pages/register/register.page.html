<ion-content [fullscreen]="true">
  <div class="auth-page">

    <header class="auth-header">
      <div class="auth-brand" (click)="goHome()">
        <img src="assets/imgs/dupolvo-logo.png" class="auth-brand-logo" alt="DuPolvo" />
        <span class="auth-brand-name">DuPolvo</span>
      </div>
    </header>

    <div class="auth-hero">
      <ion-icon name="trophy" class="auth-deco auth-deco-1"></ion-icon>
      <ion-icon name="sparkles" class="auth-deco auth-deco-2"></ion-icon>

      <div class="auth-card">
        <h1 class="auth-title">Crie a sua conta</h1>
        <p class="auth-subtitle">Leva menos de um minuto — e você já pode fazer sua primeira aposta.</p>

        <div class="auth-field">
          <label>Nome</label>
          <ion-input type="text" placeholder="Seu nome completo" #name clearInput></ion-input>
        </div>

        <div class="auth-field">
          <label>E-mail</label>
          <ion-input type="email" placeholder="seuemail@exemplo.com" #email clearInput></ion-input>
        </div>

        <div class="auth-field">
          <label>Telefone</label>
          <ion-input type="tel" placeholder="(00) 00000-0000" #phone clearInput></ion-input>
        </div>

        <div class="auth-field">
          <label>Senha</label>
          <ion-input type="password" placeholder="••••••••" #password clearInput></ion-input>
        </div>

        <div class="auth-field">
          <label>Cidade</label>
          <ion-input type="text" placeholder="Sua cidade" #city clearInput></ion-input>
        </div>

        <div class="auth-field">
          <label>Tipo de conta</label>
          <ion-segment [(ngModel)]="selectedRole" class="auth-segment">
            <ion-segment-button value="USER">
              <ion-label>Usuário</ion-label>
            </ion-segment-button>
            <ion-segment-button value="ADMIN">
              <ion-label>Admin</ion-label>
            </ion-segment-button>
          </ion-segment>
        </div>

        <button class="auth-submit" (click)="onRegister(name, email, phone, password, city)">Criar conta</button>

        <p class="auth-switch">Já tem conta? <span (click)="goToLogin()">Entrar</span></p>
      </div>
    </div>

  </div>
</ion-content>
