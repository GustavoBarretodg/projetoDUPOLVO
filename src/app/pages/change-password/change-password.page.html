<ion-content [fullscreen]="true">
  <div class="auth-page">

    <header class="auth-header">
      <div class="auth-brand" (click)="goToLogin()">
        <img src="assets/imgs/dupolvo-logo.png" class="auth-brand-logo" alt="DuPolvo" />
        <span class="auth-brand-name">DuPolvo</span>
      </div>
    </header>

    <div class="auth-hero">
      <ion-icon name="trophy" class="auth-deco auth-deco-1"></ion-icon>
      <ion-icon name="sparkles" class="auth-deco auth-deco-2"></ion-icon>

      <div class="auth-card">
        <h1 class="auth-title">Nova senha</h1>
        <p class="auth-subtitle">Escolha uma nova senha pra sua conta.</p>

        <div class="auth-field">
          <label>Nova senha</label>
          <ion-input type="password" placeholder="••••••••" #newPassword></ion-input>
        </div>

        <div class="auth-field">
          <label>Confirmar senha</label>
          <ion-input type="password" placeholder="••••••••" #confirmPassword></ion-input>
        </div>

        <button class="auth-submit" [class.auth-submit-loading]="loading" [disabled]="loading" (click)="changePassword(newPassword, confirmPassword)">
          {{ loading ? 'Salvando...' : 'Trocar senha' }}
        </button>

        <p class="auth-switch">Lembrou a senha? <span (click)="goToLogin()">Voltar pro login</span></p>
      </div>
    </div>

  </div>
</ion-content>
