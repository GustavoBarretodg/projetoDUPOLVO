<ion-content>
  <div class="ct">

    <div class="ct-topbar">
      <button class="ct-back" (click)="goHome()">
        <ion-icon name="chevron-back-outline"></ion-icon>
      </button>
      <div class="ct-brand" (click)="goHome()">
        <img src="assets/imgs/dupolvo-logo.png" alt="DuPolvo" />
        <span>DuPolvo</span>
      </div>
      <span class="ct-spacer"></span>
    </div>

    <h1 class="ct-title"><ion-icon name="cart-outline"></ion-icon> Meu Carrinho</h1>

    <ng-container *ngIf="items$ | async as items">

      <div class="ct-empty" *ngIf="items.length === 0">
        <ion-icon name="cart-outline"></ion-icon>
        <p>Seu carrinho está vazio.</p>
        <button class="ct-btn ct-btn-primary" (click)="goToGame()">Fazer um jogo</button>
      </div>

      <ng-container *ngIf="items.length > 0">
        <div class="ct-item" *ngFor="let item of items" [style.--accent]="getGameColor(item.gameType)">
          <div class="ct-item-head">
            <span class="ct-item-game" [style.color]="getGameColor(item.gameType)">{{ getGameName(item.gameType) }}</span>
            <span class="ct-item-price">{{ formatPrice(item.price) }}</span>
          </div>

          <div class="ct-item-balls">
            <span class="ct-ball" *ngFor="let n of item.numbers" [style.background]="getGameColor(item.gameType)">{{ n < 10 ? '0' + n : n }}</span>
          </div>

          <button class="ct-remove" (click)="remove(item)">
            <ion-icon name="trash-outline"></ion-icon> Remover
          </button>
        </div>

        <div class="ct-summary">
          <div class="ct-summary-row">
            <span>Total ({{ items.length }} {{ items.length === 1 ? 'aposta' : 'apostas' }})</span>
            <span class="ct-summary-total">{{ total }}</span>
          </div>
          <button class="ct-btn ct-btn-primary" (click)="goToPayment()">Ir para pagamento</button>
          <button class="ct-btn ct-btn-ghost" (click)="goToGame()">+ Adicionar mais jogos</button>
        </div>
      </ng-container>

    </ng-container>

  </div>
</ion-content>
