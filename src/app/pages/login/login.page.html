<ion-content [fullscreen]="true">
  <div class="auth-page">

    <header class="auth-header">
      <div class="auth-brand" (click)="goHome()">
        <img src="assets/imgs/dupolvo-logo.png" class="auth-brand-logo" alt="DuPolvo" />
        <span class="auth-brand-name">DuPolvo</span>
      </div>
    </header>

    <div class="auth-hero">
      <ion-icon name="trophy" class="auth-deco auth-deco-1"></ion-icon>
      <ion-icon name="sparkles" class="auth-deco auth-deco-2"></ion-icon>

      <div class="auth-card">
        <h1 class="auth-title">Entre na sua conta</h1>
        <p class="auth-subtitle">Acompanhe suas apostas e aproveite a sorte sem sair de casa.</p>

        <div class="auth-field">
          <label>E-mail</label>
          <ion-input type="email" placeholder="seuemail@exemplo.com" #email></ion-input>
        </div>

        <div class="auth-field">
          <label>Senha</label>
          <ion-input type="password" placeholder="••••••••" #password></ion-input>
        </div>

        <span class="auth-forgot" (click)="goToForgot()">Esqueci minha senha</span>

        <button class="auth-submit" (click)="onLogin(email, password)">Entrar</button>

        <p class="auth-switch">Ainda não tem conta? <span (click)="goToRegister()">Cadastre-se grátis</span></p>
      </div>
    </div>

  </div>
</ion-content>
